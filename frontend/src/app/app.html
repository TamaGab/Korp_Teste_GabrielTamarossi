<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    [mode]="isCompactNavigation() ? 'over' : 'side'"
    [opened]="!isCompactNavigation()"
  >
    <a class="brand" routerLink="/" (click)="closeAfterNavigation(sidenav)">
      <span class="brand-mark">KD</span>
      <span>KORP DESAFIO</span>
    </a>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeAfterNavigation(sidenav)"
      >
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Início</span>
      </a>
      <a
        mat-list-item
        routerLink="/products"
        routerLinkActive="active"
        (click)="closeAfterNavigation(sidenav)"
      >
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Produtos</span>
      </a>
      <a
        mat-list-item
        routerLink="/invoices"
        routerLinkActive="active"
        (click)="closeAfterNavigation(sidenav)"
      >
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Notas fiscais</span>
      </a>
    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    @if (isCompactNavigation()) {
    <mat-toolbar>
      <button
        type="button"
        aria-label="Abrir navegação"
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span>KORP DESAFIO</span>
    </mat-toolbar>
    }
    <main><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
